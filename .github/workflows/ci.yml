name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Legal files match their pins, and no retired name appears
        run: |
          grep -v '^#' legal-pins.sha256 | sha256sum --strict -c -
          if git grep -nE 'Agentic Ledger|AOAP|Agentic Operations and Accountability|Agent Health Score|Agentic Contract Spec|®' -- ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then
            echo "A retired product name or a registered-mark symbol appears outside CHANGELOG.md" >&2
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE test: tests/cli-entrypoint.test.ts spawns the built
      # dist/index.js, because the exit-code contract it guards lives in
      # process wiring that no importable unit test can observe.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
